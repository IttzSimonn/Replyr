<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Replyr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0B0F1A; --surface: #13182A;
      --border: rgba(255,255,255,0.08);
      --text: #F0F2FF; --muted: rgba(240,242,255,0.5);
      --purple: #7B61FF; --blue: #5B9CFF;
    }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .page {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 64px 24px;
      text-align: center;
    }
    .page::before {
      content: '';
      position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(123,97,255,0.1) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .inner {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      max-width: 420px; width: 100%;
    }
    .icon {
      font-size: 48px; margin-bottom: 24px;
    }
    h1 {
      font-size: 36px; font-weight: 800; letter-spacing: -1px;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 16px; color: var(--muted); line-height: 1.7;
      margin-bottom: 36px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 28px; border-radius: 14px;
      font-size: 15px; font-weight: 600;
      text-decoration: none;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: #fff;
      transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 4px 24px rgba(123,97,255,0.35);
    }
    .btn:hover { opacity: 0.88; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(123,97,255,0.4); }
    .btn:active { transform: translateY(0); opacity: 1; }
    footer {
      position: relative; z-index: 1;
      margin-top: 64px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
    }
    footer a { font-size: 13px; color: var(--muted); text-decoration: none; transition: color 0.15s; }
    footer a:hover { color: var(--text); }
    .back {
      position: absolute; top: 32px; left: 24px;
      font-size: 14px; color: var(--muted); text-decoration: none;
      transition: color 0.15s;
    }
    .back:hover { color: var(--text); }
    @media (max-width: 480px) { .page { padding: 48px 20px; } h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <a href="index.html" class="back">← Back</a>
  <main class="page">
    <div class="inner">
      <div class="icon">💬</div>
      <h1>Support</h1>
      <p class="sub">Need help? We're here.<br>Send us a message and we'll get back to you as soon as possible.</p>
      <a href="mailto:support@usereplyr.com" class="btn">
        support@usereplyr.com
      </a>
    </div>

    <footer>
      <a href="index.html">Home</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </footer>
  </main>
</body>
</html>
